services:
  # The gateway itself. `docker compose up -d --build` runs the whole stack; for local development
  # against the IDE instead, start only the infrastructure: `docker compose up -d postgres redis kafka`.
  app:
    build: .
    image: mini-payment-gateway:local
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mpg_db
      SPRING_DATASOURCE_USERNAME: mpg
      SPRING_DATASOURCE_PASSWORD: mpg_pass
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      # Feature toggles, overridable from the shell for load-test stages (see LOAD_TEST.md).
      MPG_LOCKING_STRATEGY: ${MPG_LOCKING_STRATEGY:-PESSIMISTIC}
      MPG_RATELIMIT_ENABLED: ${MPG_RATELIMIT_ENABLED:-true}
      MPG_FRAUD_ENABLED: ${MPG_FRAUD_ENABLED:-true}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: mpg
      POSTGRES_PASSWORD: mpg_pass
      POSTGRES_DB: mpg_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mpg -d mpg_db"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Single-node KRaft broker (no ZooKeeper) - the same image the integration tests run against.
  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Containers on the compose network (the app) connect to kafka:29092; processes on the host
      # (IDE runs, CLI tools) connect to localhost:9092.
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 20

volumes:
  postgres_data:
  redis_data:
