name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # verify = unit tests (surefire) + Testcontainers integration tests (failsafe).
      # GitHub-hosted Ubuntu runners ship Docker, which Testcontainers uses directly.
      - name: Build and test
        run: ./mvnw -B verify

  docker:
    # Only package an image once the full test suite is green.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: mini-payment-gateway:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
